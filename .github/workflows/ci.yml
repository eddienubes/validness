name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
jobs:
  CI:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up toolchain (Node ${{ matrix.node }}, pnpm)
        uses: jdx/mise-action@v5

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci

      - name: Check Package
        run: pnpm run check:package

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.node == '24' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: eddienubes/validness
